# docker compose -f deploy/docker-compose.yml up -d
services:
  rizzserver:
    build:
      context: ..
    image: rizzserver
    restart: unless-stopped
    ports:
      - "4840:4840"                 # OPC UA
      - "127.0.0.1:5080:5080"       # REST API: loopback only; put a TLS reverse proxy in front to expose it
    environment:
      # RIZZSERVER_API_KEY: "choose-a-long-random-key"   # otherwise generated on first start (see `docker logs`)
      RIZZSERVER_AUTOSTART: "true"
    volumes:
      - rizzserver-data:/data
    # Serial devices: map them in, e.g.
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
volumes:
  rizzserver-data:
